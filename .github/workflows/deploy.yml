name: Deploy Eco Vila Landing Page to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH usando Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Entra na pasta (cria caso não exista por garantia)
            mkdir -p ~/ChaletToGo/eco-vila
            cd ~/ChaletToGo/eco-vila

            # Caso a pasta exista mas não seja um repo Git válido, clona diretamente na pasta
            if [ ! -d ".git" ]; then
              # Se houver arquivos que impeçam o clone limpo, o git clone força o reuso no diretório corrente se estiver vazio, 
              # ou você pode inicializar o repositório diretamente:
              git init
              git remote add origin https://github.com/ChaletToGo/eco-vila.git || git remote set-url origin https://github.com/ChaletToGo/eco-vila.git
            fi

            # Garante que o remote correto está configurado
            git remote set-url origin https://github.com/ChaletToGo/eco-vila.git

            # Atualiza para os últimos commits da main descartando alterações locais
            git fetch origin main
            git checkout -B main origin/main
            git reset --hard origin/main

            # Reconstrói e sobe o container na porta 3001
            docker compose up -d --build --remove-orphans

            # Limpa imagens antigas do Docker
            docker image prune -f