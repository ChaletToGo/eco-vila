name: Deploy Eco Vila Landing Page to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH usando Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Entra na pasta (cria caso não exista por garantia)
            mkdir -p ~/ChaletToGo/eco-vila
            cd ~/ChaletToGo/eco-vila

            # Caso a pasta exista mas não seja um repo Git válido, inicializa o Git
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com/ChaletToGo/eco-vila.git || git remote set-url origin https://github.com/ChaletToGo/eco-vila.git
            fi

            # Garante que o remote correto está configurado
            git remote set-url origin https://github.com/ChaletToGo/eco-vila.git

            # Atualiza para os últimos commits da main descartando alterações locais
            git fetch origin main
            git checkout -B main origin/main
            git reset --hard origin/main

            # Força o rebuild sem usar o cache das camadas do Docker
            docker compose build --no-cache

            # Sobe o container destruindo a instância anterior em memória
            docker compose up -d --force-recreate --remove-orphans

            # Limpa imagens e camadas antigas/sem uso do Docker
            docker image prune -a -f